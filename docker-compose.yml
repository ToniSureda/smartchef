services:
  # Base de datos PostgreSQL
  db:
    build: ./data/database
    container_name: smartchef_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
 #   ports:
 #     - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Backend FastAPI
  backend:
    build: ./src/backend
    container_name: smartchef_backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./src/backend:/app
      - ./data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped

  # Servidor Nginx (Frontend)
  frontend:
    image: nginx:alpine
    container_name: smartchef_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src/frontend:/usr/share/nginx/html
      - ./src/frontend/certs:/etc/nginx/certs 
      - ./src/frontend/default.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

  # Pipeline de Datos
  pipeline:
    build: ./src/pipeline
    container_name: smartchef_pipeline
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/pipeline:/app
      - ./data:/data
      - ./src/backend:/app/backend
    environment:
      - DATABASE_URL=${DATABASE_URL}

volumes:
  db_data: